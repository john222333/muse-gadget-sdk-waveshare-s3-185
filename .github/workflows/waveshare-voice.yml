name: Waveshare voice regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  speech:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r tools/muse_host/requirements.txt -r tools/device_setup/requirements.txt
      - run: python -m unittest discover -s tools/muse_host/tests -v
      - run: python esp32/tests/test_reply_speech_pipeline.py
      - run: cc -I esp32/components/muse esp32/tests/reply_phrase_cases.c -o /tmp/phrase && /tmp/phrase
      - run: python -m unittest discover -s tools/device_setup/tests -v
